name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test
      - name: Generate portable skills
        run: npm run sync:skills
      - name: Validate syntax and registries
        run: npm run validate
      - name: Ensure generated skills are committed
        run: |
          git ls-files --error-unmatch .agents/skills/agencyos/SKILL.md .claude/skills/agencyos/SKILL.md
          git diff --exit-code -- .agents/skills .claude/skills
