services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "4173"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agencyos}
      AGENCYOS_SESSION_SECRET: ${AGENCYOS_SESSION_SECRET:?set AGENCYOS_SESSION_SECRET}
      AGENCYOS_USERS_JSON: ${AGENCYOS_USERS_JSON:?set AGENCYOS_USERS_JSON}
      AGENCYOS_COOKIE_SECURE: "true"
      AGENCYOS_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - agencyos-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agencyos}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agencyos-data:
  postgres-data:
